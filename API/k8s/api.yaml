apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
      - name: alembic-migrate
        image: makslem/api-k8s:latest
        command: ["sh", "-c", "alembic upgrade head"]
        env:
        - name: DATABASE_URL
          value: postgresql://postgres:Postgresql123@postgres:5432/VetAPI
      containers:
      - name: api
        image: makslem/api-k8s:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: postgresql://postgres:Postgresql123@postgres:5432/VetAPI
        command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
  - port: 8000